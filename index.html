<!doctype html>
<html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="index.css" />
      <title>My Personal Page</title>
    </head>

    <body>
      <form class="form" method="get">
        <h2>عبدالرحمن محمد</h2>
        <h4>
          <p>مبرمج شغوف ومهتم ببرمجة المواقع الالكترونية</p>
        </h4>
        <input
          id="name"
          type="text"
          required
          placeholder="أدخل اسمك"
          name="name"
        />
        <label for="name">الاسم</label>
        <br />
        <input
          id="gmail"
          type="email"
          required
          name="gmail"
          placeholder="أدخل بريدك الإلكتروني"
        />
        <label for="gmail">البريد الإلكتروني</label>
        <br />
        <button type="submit">إرسال</button>
      </form>
      <table>
        <thead>
          <tr>
            <th>المدة</th>
            <th>اللغة</th>
            <th>الاسبوع</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>4</td>
            <td>HTML</td>
            <td>الاول</td>
          </tr>
          <tr class="row">
            <td>3</td>
            <td>CSS</td>
            <td>الثاني</td>
          </tr>
          <tr class="row">
            <td>3</td>
            <td>JavaScript</td>
            <td>الثالث</td>
          </tr>
        </tbody>
      </table>
    </body>
  </html>
</html>
